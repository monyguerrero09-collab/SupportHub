<div class="pb-10" x-data="{}" x-init="
    $nextTick(() => {
        if (typeof Chart === 'undefined') {
            console.error('Chart.js not loaded');
            return;
        }

        const kill = (id) => {
            const el = document.getElementById(id);
            if (el && el._chartjs) { el._chartjs.destroy(); delete el._chartjs; }
        };

        /* ── PHP data baked directly into JS ── */
        const MONTHS   = @json($trendMonths->values());
        const CREATED  = @json($trendData);
        const CLOSED   = @json($trendClosedData);
        const P_LABELS = @json(array_keys($plantaCounts));
        const P_DATA   = @json(array_values($plantaCounts));

        const C_DATA   = @json($categoryData->values()->values());
        const S_OPEN   = {{ $statusCounts[1] ?? 0 }};
        const S_PROC   = {{ $statusCounts[2] ?? 0 }};
        const S_DONE   = {{ ($statusCounts[3] ?? 0) + ($statusCounts[4] ?? 0) }};

        /* ── Shared chart defaults ── */
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = 'rgba(51,65,85,0.3)';
        const TIP = { backgroundColor: '#0f172a', titleColor: '#f1f5f9', bodyColor: '#94a3b8', borderColor: '#1e293b', borderWidth: 1, padding: 12, cornerRadius: 10 };

        /* 1. TENDENCIA */
        kill('ch-trend');
        const c1 = document.getElementById('ch-trend');
        if (c1) {
            c1._chartjs = new Chart(c1, {
                type: 'line',
                data: {
                    labels: MONTHS,
                    datasets: [
                        {
                            label: 'Tickets Creados',
                            data: CREATED,
                            borderColor: '#6366f1',
                            backgroundColor: (ctx) => {
                                const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 300);
                                g.addColorStop(0, 'rgba(99,102,241,0.25)');
                                g.addColorStop(1, 'rgba(99,102,241,0)');
                                return g;
                            },
                            borderWidth: 3, tension: 0.45, fill: true,
                            pointBackgroundColor: '#6366f1', pointBorderColor: '#0f172a',
                            pointRadius: 5, pointHoverRadius: 9, pointBorderWidth: 2
                        },
                        {
                            label: 'Tickets Cerrados',
                            data: CLOSED,
                            borderColor: '#10b981',
                            backgroundColor: 'transparent',
                            borderWidth: 2, borderDash: [6, 4], tension: 0.45,
                            pointBackgroundColor: '#10b981', pointBorderColor: '#0f172a',
                            pointRadius: 4, pointHoverRadius: 7, pointBorderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { labels: { usePointStyle: true, pointStyleWidth: 10, padding: 20, font: { size: 11, weight: 'bold' } } },
                        tooltip: TIP
                    },
                    scales: {
                        x: { grid: { color: 'rgba(51,65,85,0.2)' }, ticks: { font: { size: 11 } } },
                        y: { grid: { color: 'rgba(51,65,85,0.2)' }, ticks: { precision: 0, font: { size: 11 } }, beginAtZero: true }
                    }
                }
            });
        }

        /* 2. DISTRIBUCIÓN PLANTA */
        kill('ch-planta');
        const c2 = document.getElementById('ch-planta');
        if (c2) {
            c2._chartjs = new Chart(c2, {
                type: 'doughnut',
                data: {
                    labels: P_LABELS,
                    datasets: [{
                        data: P_DATA,
                        backgroundColor: ['#6366f1', '#06b6d4'],
                        borderColor: '#080c1a', borderWidth: 4, hoverOffset: 8
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '74%',
                    plugins: {
                        legend: { position: 'bottom', labels: { usePointStyle: true, padding: 16, font: { size: 11, weight: 'bold' } } },
                        tooltip: TIP
                    }
                }
            });
        }

        /* 3. TIPOS DE PROBLEMA */
        kill('ch-cat');
        const c3 = document.getElementById('ch-cat');
        if (c3) {
            const bgs = ['rgba(168,85,247,0.7)','rgba(59,130,246,0.7)','rgba(16,185,129,0.7)','rgba(245,158,11,0.7)','rgba(239,68,68,0.7)','rgba(20,184,166,0.7)'];
            c3._chartjs = new Chart(c3, {
                type: 'bar',
                data: {
                    labels: C_LABELS.length ? C_LABELS : ['Sin datos'],
                    datasets: [{
                        label: 'Tickets',
                        data: C_DATA.length ? C_DATA : [0],
                        backgroundColor: bgs,
                        borderRadius: 8, barThickness: 20
                    }]
                },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: TIP },
                    scales: {
                        x: { grid: { color: 'rgba(51,65,85,0.2)' }, ticks: { precision: 0, font: { size: 10 } }, beginAtZero: true },
                        y: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });
        }

        /* 4. PROPORCIÓN DE ESTADOS */
        kill('ch-status');
        const c4 = document.getElementById('ch-status');
        if (c4) {
            c4._chartjs = new Chart(c4, {
                type: 'doughnut',
                data: {
                    labels: ['Abiertos', 'En Proceso', 'Resueltos'],
                    datasets: [{
                        data: [S_OPEN, S_PROC, S_DONE],
                        backgroundColor: ['#3b82f6', '#f59e0b', '#10b981'],
                        borderColor: '#080c1a', borderWidth: 4, hoverOffset: 8
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '70%',
                    plugins: {
                        legend: { position: 'bottom', labels: { usePointStyle: true, padding: 14, font: { size: 10, weight: 'bold' } } },
                        tooltip: TIP
                    }
                }
            });
        }
    });
